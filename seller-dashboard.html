<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard — PHYNEX</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6f8;
            color: #222;
            line-height: 1.6;
        }

        .header {
            height: 64px;
            background: #073bce;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            color: white;
        }

        .logo { font-size: 25px; font-weight: 800; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 14px;
        }

        .header-right a, .header-right button {
            color: white;
            text-decoration: none;
            font-weight: 600;
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }

        .header-right a:hover, .header-right button:hover { text-decoration: underline; }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 35px auto 60px;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 22px;
            align-items: start;
        }

        @media (max-width: 800px) {
            .container { grid-template-columns: 1fr; }
        }

        .card {
            background: white;
            border: 1px solid #e2e4e8;
            padding: 26px 26px 30px;
        }

        .card h2 { font-size: 18px; margin-bottom: 4px; }
        .card p.sub { color: #666; font-size: 13px; margin-bottom: 18px; }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 5px;
            margin-top: 14px;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d9dde5;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
        }

        textarea { resize: vertical; min-height: 60px; }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #073bce;
        }

        .price-row { display: flex; gap: 10px; }
        .price-row > div { flex: 1; }

        /* ---- Categories (single-select) ---- */

        .categories {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-top: 6px;
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid #e2e4e8;
            border-radius: 5px;
            padding: 8px 12px;
        }

        .categories label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 400;
            font-size: 13px;
            margin: 0;
            padding: 6px 0;
            cursor: pointer;
        }

        .categories input[type="radio"] { width: auto; margin: 0; }

        #categoryOtherInput {
            display: none;
            margin-top: 8px;
        }

        /* ---- Media upload (images + short videos) ---- */

        .media-upload {
            border: 1.5px dashed #c7cddb;
            border-radius: 6px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            background: #fafbfc;
            transition: border-color .15s ease, background .15s ease;
        }

        .media-upload:hover,
        .media-upload.dragover {
            border-color: #073bce;
            background: #f1f5ff;
        }

        .media-upload input[type="file"] {
            display: none;
        }

        .media-upload-label {
            font-size: 13px;
            color: #555;
        }

        .media-upload-label strong {
            color: #073bce;
        }

        .media-hint {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        .media-previews {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .media-thumb {
            position: relative;
            width: 64px;
            height: 64px;
            border-radius: 5px;
            overflow: hidden;
            background: #eee;
            border: 1px solid #ddd;
            flex-shrink: 0;
        }

        .media-thumb img,
        .media-thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .media-thumb .remove-thumb {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(0,0,0,.6);
            color: #fff;
            border: none;
            font-size: 11px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .media-thumb .video-tag {
            position: absolute;
            bottom: 2px;
            left: 2px;
            background: rgba(0,0,0,.65);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 3px;
        }

        button.submit {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #073bce;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        button.submit:hover { background: #052fa5; }
        button.submit:disabled { opacity: .6; cursor: default; }

        .msg {
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 5px;
            font-size: 13px;
            display: none;
        }

        .msg.error { display: block; background: #fdeaea; color: #b42318; }
        .msg.success { display: block; background: #e8f6ec; color: #0f7a3d; }

        /* PRODUCT LIST */

        .product-row {
            display: flex;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid #eee;
            align-items: flex-start;
        }

        .product-row:last-child { border-bottom: none; }

        .product-row img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            background: #f5f6f8;
            border: 1px solid #eee;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .product-row .info { flex: 1; min-width: 0; }

        .product-row .name {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .product-row .price {
            font-size: 13px;
            color: #071a49;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .badge.pending { background: #fff4e0; color: #a15c00; }
        .badge.approved { background: #e8f6ec; color: #0f7a3d; }
        .badge.rejected { background: #fdeaea; color: #b42318; }
        .badge.sponsored {
            background: #eaf1ff;
            color: #073bce;
            margin-left: 6px;
        }

        .reject-reason {
            font-size: 12px;
            color: #b42318;
            margin-top: 4px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 12px;
            text-decoration: underline;
            margin-top: 6px;
        }

        .delete-btn:hover { color: #b42318; }

        .empty-note {
            color: #777;
            font-size: 13px;
            padding: 10px 0;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">PHYNEX <span style="font-weight:400;font-size:14px;">Seller</span></div>
        <div class="header-right">
            <span id="sellerNameLabel"></span>
            <a href="index.html">Store</a>
            <button id="logoutBtn">Log Out</button>
        </div>
    </header>

    <main class="container">

        <div class="card">
            <h2>Submit a Product</h2>
            <p class="sub">New listings go to PHYNEX for review before they appear in the store.</p>

            <form id="productForm">

                <label for="name">Product name</label>
                <input type="text" id="name" required>

                <label for="media">Photos & videos</label>
                <div class="media-upload" id="mediaUpload">
                    <input type="file" id="media" accept="image/*,video/*" multiple>
                    <div class="media-upload-label"><strong>Click to upload</strong> or drag files here</div>
                    <div class="media-hint">Images (JPG, PNG, WebP) or short videos (MP4, MOV) · up to 6 files</div>
                    <div class="media-previews" id="mediaPreviews"></div>
                </div>

                <div class="price-row">
                    <div>
                        <label for="price">Price (KSh)</label>
                        <input type="number" id="price" min="1" required>
                    </div>
                    <div>
                        <label for="oldPrice">Old price (optional)</label>
                        <input type="number" id="oldPrice" min="1">
                    </div>
                </div>

                <label for="description">Description</label>
                <textarea id="description"></textarea>

                <label for="specifications">Specifications</label>
                <textarea id="specifications" placeholder="e.g. Intel Core i5 | 8GB RAM | 256GB SSD"></textarea>

                <label>Category</label>
                <div class="categories" id="categoryList">
                    <label><input type="radio" name="category" value="Phones & Tablets"> Phones & Tablets</label>
                    <label><input type="radio" name="category" value="Computers"> Computers</label>
                    <label><input type="radio" name="category" value="Electronics"> Electronics</label>
                    <label><input type="radio" name="category" value="Gaming"> Gaming</label>
                    <label><input type="radio" name="category" value="Accessories"> Accessories</label>
                    <label><input type="radio" name="category" value="Home & Office"> Home & Office</label>
                    <label><input type="radio" name="category" value="Fashion & Clothing"> Fashion & Clothing</label>
                    <label><input type="radio" name="category" value="Beauty & Personal Care"> Beauty & Personal Care</label>
                    <label><input type="radio" name="category" value="Health & Wellness"> Health & Wellness</label>
                    <label><input type="radio" name="category" value="Groceries & Food"> Groceries & Food</label>
                    <label><input type="radio" name="category" value="Baby & Kids"> Baby & Kids</label>
                    <label><input type="radio" name="category" value="Toys & Games"> Toys & Games</label>
                    <label><input type="radio" name="category" value="Sports & Outdoors"> Sports & Outdoors</label>
                    <label><input type="radio" name="category" value="Automotive"> Automotive</label>
                    <label><input type="radio" name="category" value="Books & Stationery"> Books & Stationery</label>
                    <label><input type="radio" name="category" value="Furniture"> Furniture</label>
                    <label><input type="radio" name="category" value="Pet Supplies"> Pet Supplies</label>
                    <label><input type="radio" name="category" value="Music & Instruments"> Music & Instruments</label>
                    <label><input type="radio" name="category" value="Art & Crafts"> Art & Crafts</label>
                    <label><input type="radio" name="category" value="Jewelry & Watches"> Jewelry & Watches</label>
                    <label><input type="radio" name="category" value="Other" id="categoryOther"> Other</label>
                </div>
                <input type="text" id="categoryOtherInput" placeholder="Type your category">

                <div id="formMsg" class="msg"></div>

                <button type="submit" class="submit" id="submitBtn">Submit for Review</button>
            </form>
        </div>

        <div class="card">
            <h2>Your Products</h2>
            <p class="sub">Track the review status of everything you've submitted.</p>
            <div id="productList"></div>
        </div>

    </main>

    <script>
        var token = localStorage.getItem('phynexSellerToken');

        if (!token) {
            window.location.href = 'seller-login.html';
        }

        document.getElementById('sellerNameLabel').textContent =
            localStorage.getItem('phynexSellerName') || '';

        document.getElementById('logoutBtn').addEventListener('click', function () {
            localStorage.removeItem('phynexSellerToken');
            localStorage.removeItem('phynexSellerName');
            window.location.href = 'seller-login.html';
        });

        function money(value) {
            return 'KSh ' + Number(value || 0).toLocaleString('en-KE');
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        /* ---- Category select: show/hide the "Other" text box ---- */

        var categoryOtherRadio = document.getElementById('categoryOther');
        var categoryOtherInput = document.getElementById('categoryOtherInput');

        document.querySelectorAll('input[name="category"]').forEach(function (radio) {
            radio.addEventListener('change', function () {
                categoryOtherInput.style.display = categoryOtherRadio.checked ? 'block' : 'none';
                if (!categoryOtherRadio.checked) {
                    categoryOtherInput.value = '';
                }
            });
        });

        /* ---- Media upload handling ---- */

        var MAX_FILES = 6;
        var selectedFiles = []; // File objects, kept in sync with the previews

        var mediaInput = document.getElementById('media');
        var mediaUpload = document.getElementById('mediaUpload');
        var mediaPreviews = document.getElementById('mediaPreviews');

        mediaUpload.addEventListener('click', function (e) {
            if (e.target === mediaInput) return;
            mediaInput.click();
        });

        ['dragover', 'dragenter'].forEach(function (evt) {
            mediaUpload.addEventListener(evt, function (e) {
                e.preventDefault();
                mediaUpload.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(function (evt) {
            mediaUpload.addEventListener(evt, function (e) {
                e.preventDefault();
                mediaUpload.classList.remove('dragover');
            });
        });

        mediaUpload.addEventListener('drop', function (e) {
            addFiles(e.dataTransfer.files);
        });

        mediaInput.addEventListener('change', function () {
            addFiles(mediaInput.files);
            mediaInput.value = ''; // allow re-selecting the same file later
        });

        function addFiles(fileList) {
            Array.from(fileList).forEach(function (file) {
                if (selectedFiles.length >= MAX_FILES) return;
                if (!/^image\/|^video\//.test(file.type)) return;
                selectedFiles.push(file);
            });
            renderPreviews();
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            renderPreviews();
        }

        function renderPreviews() {
            mediaPreviews.innerHTML = '';

            selectedFiles.forEach(function (file, index) {
                var url = URL.createObjectURL(file);
                var thumb = document.createElement('div');
                thumb.className = 'media-thumb';

                var mediaEl;
                if (file.type.indexOf('video/') === 0) {
                    mediaEl = document.createElement('video');
                    mediaEl.src = url;
                    mediaEl.muted = true;
                } else {
                    mediaEl = document.createElement('img');
                    mediaEl.src = url;
                }
                thumb.appendChild(mediaEl);

                if (file.type.indexOf('video/') === 0) {
                    var tag = document.createElement('span');
                    tag.className = 'video-tag';
                    tag.textContent = 'VIDEO';
                    thumb.appendChild(tag);
                }

                var removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'remove-thumb';
                removeBtn.textContent = '×';
                removeBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    removeFile(index);
                });
                thumb.appendChild(removeBtn);

                mediaPreviews.appendChild(thumb);
            });
        }

        /* ---- Product list ---- */

        async function loadProducts() {

            var list = document.getElementById('productList');

            try {
                var response = await fetch('/api/seller/products', {
                    headers: { Authorization: 'Bearer ' + token }
                });

                if (response.status === 401) {
                    localStorage.removeItem('phynexSellerToken');
                    window.location.href = 'seller-login.html';
                    return;
                }

                var data = await response.json();
                var products = data.products || [];

                if (products.length === 0) {
                    list.innerHTML = '<p class="empty-note">You haven\'t submitted any products yet.</p>';
                    return;
                }

                list.innerHTML = products.map(function (product) {

                    var reasonHtml = '';
                    if (product.status === 'rejected' && product.rejectionReason) {
                        reasonHtml = '<div class="reject-reason">Reason: ' + escapeHtml(product.rejectionReason) + '</div>';
                    }

                    var sponsoredHtml = product.sponsored
                        ? '<span class="badge sponsored">Sponsored</span>'
                        : '';

                    var thumbSrc = (product.images && product.images[0]) || product.image || '';

                    return '' +
                        '<div class="product-row" data-id="' + product.id + '">' +
                            '<img src="' + escapeHtml(thumbSrc) + '" onerror="this.style.visibility=\'hidden\'">' +
                            '<div class="info">' +
                                '<div class="name">' + escapeHtml(product.name) + '</div>' +
                                '<div class="price">' + money(product.price) + '</div>' +
                                '<span class="badge ' + product.status + '">' + product.status + '</span>' +
                                sponsoredHtml +
                                reasonHtml +
                                '<div><button class="delete-btn" onclick="deleteProduct(' + product.id + ')">Remove</button></div>' +
                            '</div>' +
                        '</div>';

                }).join('');

            } catch (error) {
                list.innerHTML = '<p class="empty-note">Could not load your products.</p>';
            }
        }

        window.deleteProduct = async function (id) {

            if (!confirm('Remove this product listing?')) return;

            await fetch('/api/seller/products/' + id, {
                method: 'DELETE',
                headers: { Authorization: 'Bearer ' + token }
            });

            loadProducts();
        };

        document.getElementById('productForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            var msg = document.getElementById('formMsg');
            var btn = document.getElementById('submitBtn');

            var selectedRadio = document.querySelector('input[name="category"]:checked');
            var category = selectedRadio ? selectedRadio.value : '';

            if (category === 'Other') {
                category = categoryOtherInput.value.trim();
            }

            if (!category) {
                msg.className = 'msg error';
                msg.textContent = 'Please choose a category.';
                return;
            }

            msg.className = 'msg';
            btn.disabled = true;
            btn.textContent = 'Submitting...';

            try {
                // Sends the form as multipart/form-data so the actual
                // image/video files travel with the request, instead
                // of a JSON body with an image URL string.
                var formData = new FormData();
                formData.append('name', document.getElementById('name').value.trim());
                formData.append('price', document.getElementById('price').value);
                formData.append('oldPrice', document.getElementById('oldPrice').value);
                formData.append('description', document.getElementById('description').value.trim());
                formData.append('specifications', document.getElementById('specifications').value.trim());
                formData.append('category', category);

                selectedFiles.forEach(function (file) {
                    formData.append('media', file);
                });

                var response = await fetch('/api/products', {
                    method: 'POST',
                    headers: {
                        Authorization: 'Bearer ' + token
                        // No Content-Type here — the browser sets the
                        // correct multipart boundary automatically.
                    },
                    body: formData
                });

                var data = await response.json();

                if (!response.ok) {
                    msg.className = 'msg error';
                    msg.textContent = data.message || 'Could not submit product.';
                    btn.disabled = false;
                    btn.textContent = 'Submit for Review';
                    return;
                }

                msg.className = 'msg success';
                msg.textContent = 'Submitted! Your product is pending review.';
                document.getElementById('productForm').reset();
                categoryOtherInput.style.display = 'none';
                selectedFiles = [];
                renderPreviews();
                btn.disabled = false;
                btn.textContent = 'Submit for Review';

                loadProducts();

            } catch (error) {
                msg.className = 'msg error';
                msg.textContent = 'Network error. Please try again.';
                btn.disabled = false;
                btn.textContent = 'Submit for Review';
            }
        });

        loadProducts();
    </script>

</body>
</html>
