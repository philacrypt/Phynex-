<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Phone — PHYNEX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0} body{font-family:Arial,Helvetica,sans-serif;background:#f5f6f8;color:#172033;line-height:1.6}
.top{background:#071a49;color:#fff;padding:16px 5%;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none}
.wrap{width:90%;max-width:420px;margin:50px auto}.card{background:#fff;border:1px solid #e1e4e8;border-radius:12px;padding:32px 30px}
h1{font-size:24px;margin-bottom:6px}.sub{color:#666;font-size:14px;margin-bottom:22px}
label{display:block;font-size:13px;font-weight:700;margin:16px 0 6px}input{width:100%;padding:11px 13px;border:1px solid #d9dde5;border-radius:5px;font-size:16px;letter-spacing:4px}
button{width:100%;margin-top:20px;padding:13px;background:#0875e1;color:#fff;border:0;border-radius:7px;font-weight:700;cursor:pointer}
button.secondary{background:#fff;color:#0875e1;border:1px solid #d9dde5;margin-top:10px}.msg{margin-top:16px;padding:10px 12px;border-radius:5px;font-size:13px;display:none}.msg.error{display:block;background:#fdeaea;color:#b42318}.msg.success{display:block;background:#e8f6ec;color:#0f7a3d}
</style>
</head>
<body>
<header class="top"><strong>PHYNEX</strong><a href="index.html">← Continue Shopping</a></header>
<main class="wrap"><div class="card">
<h1>Verify your phone</h1>
<p class="sub">Enter the 6-digit code sent to your Kenyan phone number.</p>
<form id="form">
<label for="code">Verification code</label>
<input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" required>
<div id="msg" class="msg"></div>
<button id="submit" type="submit">Verify phone</button>
</form>
<button class="secondary" id="resend" type="button">Send a new code</button>
</div></main>
<script>
var redirect = new URLSearchParams(location.search).get('redirect') || '';
var msg=document.getElementById('msg');
function show(text,ok){msg.className=ok?'msg success':'msg error';msg.textContent=text;}
document.getElementById('form').addEventListener('submit',async function(e){
 e.preventDefault(); var btn=document.getElementById('submit'); btn.disabled=true;
 try{
  var r=await fetch('/api/customers/verify-phone',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('code').value.trim()})});
  var data=await r.json();
  if(!r.ok){show(data.message||'Invalid phone verification code.',false);btn.disabled=false;return;}
  show('Your phone number has been verified.',true);
  setTimeout(function(){location.href=redirect||'account.html';},600);
 }catch(e){show('Network error. Please try again.',false);btn.disabled=false;}
});
document.getElementById('resend').addEventListener('click',async function(){
 try{
  var r=await fetch('/api/customers/resend-phone-code',{method:'POST',credentials:'include'});
  var data=await r.json(); show(data.message||'A new code has been sent.',r.ok);
 }catch(e){show('Network error. Please try again.',false);}
});
</script>
</body>
</html>
