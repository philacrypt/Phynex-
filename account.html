<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account | PHYNEX</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#172033;font-family:Arial,Helvetica,sans-serif}.account-page{width:min(520px,92%);margin:38px auto}.account-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{color:#071a49;font-size:25px;font-weight:800;text-decoration:none}.back{color:#0875e1;font-size:13px;font-weight:bold;text-decoration:none}.panel{background:#fff;border:1px solid #e1e4e8;border-radius:6px;padding:26px}.panel h1{margin:0 0 8px;color:#071a49;font-size:24px}.intro,.message{color:#687083;line-height:1.5;font-size:13px}.tabs{display:grid;grid-template-columns:1fr 1fr;margin:22px 0 18px;border-bottom:1px solid #e1e4e8}.tabs button{border:0;border-bottom:2px solid transparent;background:#fff;padding:11px;color:#687083;font-weight:bold;cursor:pointer}.tabs button.active{border-color:#0875e1;color:#0875e1}.form{display:grid;gap:13px}.field{display:grid;gap:5px}.field label{font-size:13px;font-weight:bold}.field input{width:100%;padding:12px;border:1px solid #d9dde5;border-radius:3px;font:inherit}.primary,.google{width:100%;padding:13px;border-radius:3px;font-weight:bold;cursor:pointer}.primary{border:0;background:#0875e1;color:#fff}.google{display:block;border:1px solid #d9dde5;background:#fff;color:#172033;text-align:center;text-decoration:none}.hidden{display:none}.signed-in{padding:16px;background:#f7f9ff;border:1px solid #dbe8fa}.signed-in strong{display:block;color:#071a49;font-size:18px;margin-bottom:6px}.signout{margin-top:14px;border:0;background:#071a49;color:#fff;padding:11px 15px;border-radius:3px;font-weight:bold;cursor:pointer}@media(max-width:480px){.account-page{margin:20px auto}.panel{padding:20px}}
</style>
</head>
<body>
<main class="account-page">
<header class="account-header"><a class="brand" href="index.html">PHYNEX</a><a class="back" href="index.html">Back to store</a></header>
<section class="panel">
<h1>PHYNEX Account</h1><p class="intro">Create a real customer account or sign in securely. Email verification is required before checkout.</p>
<div id="signedIn" class="signed-in hidden"><strong id="accountName"></strong><span id="accountEmail"></span><br><button id="signOut" class="signout" type="button">Sign out</button></div>
<div id="authForms"><div class="tabs"><button id="loginTab" class="active" type="button">Sign in</button><button id="registerTab" type="button">Create account</button></div>
<form id="loginForm" class="form"><div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" required autocomplete="email"></div><div class="field"><label for="loginPassword">Password</label><input id="loginPassword" type="password" required autocomplete="current-password"></div><button class="primary" type="submit">Sign in</button><a class="google" href="/api/auth/google">Continue with Google</a><button id="forgotButton" class="back" type="button">Forgot password?</button></form>
<form id="forgotForm" class="form hidden"><div class="field"><label for="forgotEmail">Account email</label><input id="forgotEmail" type="email" required autocomplete="email"></div><button class="primary" type="submit">Email reset link</button></form>
<form id="registerForm" class="form hidden"><div class="field"><label for="registerName">Full name</label><input id="registerName" required></div><div class="field"><label for="registerEmail">Email</label><input id="registerEmail" type="email" required autocomplete="email"></div><div class="field"><label for="registerPhone">Phone number</label><input id="registerPhone" type="tel" required autocomplete="tel"></div><div class="field"><label for="registerPassword">Password</label><input id="registerPassword" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label for="registerConfirm">Confirm password</label><input id="registerConfirm" type="password" minlength="8" required autocomplete="new-password"></div><button class="primary" type="submit">Create account</button><a class="google" href="/api/auth/google">Continue with Google</a></form></div>
<form id="resetForm" class="form hidden"><div class="field"><label for="resetPassword">New password</label><input id="resetPassword" type="password" minlength="8" required></div><button class="primary" type="submit">Reset password</button></form><p id="accountMessage" class="message" role="status"></p>
</section>
</main>
<script>
const message=document.getElementById('accountMessage');const authForms=document.getElementById('authForms');const signedIn=document.getElementById('signedIn');
function showMessage(text){message.textContent=text;}
async function refreshAccount(){const result=await fetch('/api/auth/me');const data=await result.json();if(data.authenticated){authForms.classList.add('hidden');signedIn.classList.remove('hidden');document.getElementById('accountName').textContent=data.user.name;document.getElementById('accountEmail').textContent=data.user.email;}else{authForms.classList.remove('hidden');signedIn.classList.add('hidden');}}
document.getElementById('loginTab').onclick=()=>{document.getElementById('loginTab').classList.add('active');document.getElementById('registerTab').classList.remove('active');document.getElementById('loginForm').classList.remove('hidden');document.getElementById('registerForm').classList.add('hidden');};document.getElementById('registerTab').onclick=()=>{document.getElementById('registerTab').classList.add('active');document.getElementById('loginTab').classList.remove('active');document.getElementById('registerForm').classList.remove('hidden');document.getElementById('loginForm').classList.add('hidden');};
document.getElementById('loginForm').onsubmit=async event=>{event.preventDefault();const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:loginEmail.value,password:loginPassword.value})});const data=await response.json();showMessage(data.message||'Signed in.');if(response.ok){await refreshAccount();const next=new URLSearchParams(location.search).get('next');if(next) location.href=next;}};
document.getElementById('forgotButton').onclick=()=>{document.getElementById('loginForm').classList.add('hidden');document.getElementById('forgotForm').classList.remove('hidden');};
document.getElementById('forgotForm').onsubmit=async event=>{event.preventDefault();const response=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:forgotEmail.value})});const data=await response.json();showMessage(data.message||'Unable to send reset link.');};
document.getElementById('registerForm').onsubmit=async event=>{event.preventDefault();if(registerPassword.value!==registerConfirm.value){showMessage('Passwords do not match.');return;}const response=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:registerName.value,email:registerEmail.value,phone:registerPhone.value,password:registerPassword.value})});const data=await response.json();showMessage(data.message||'Unable to create account.');};
document.getElementById('signOut').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.reload();};
document.getElementById('resetForm').onsubmit=async event=>{event.preventDefault();const response=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:new URLSearchParams(location.search).get('reset'),password:resetPassword.value})});const data=await response.json();showMessage(data.message);};
const resetToken=new URLSearchParams(location.search).get('reset');if(resetToken){authForms.classList.add('hidden');document.getElementById('resetForm').classList.remove('hidden');}refreshAccount();if(location.search.includes('verified=1'))showMessage('Email verified. You can now sign in.');
</script>
</body>
</html>
