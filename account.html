<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account | PHYNEX</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#172033;font-family:Arial,Helvetica,sans-serif}.panel{width:min(460px,92%);margin:70px auto;background:#fff;border:1px solid #e1e4e8;border-radius:6px;padding:28px}.panel h1{margin:0 0 8px;color:#071a49}.panel p{color:#687083;line-height:1.5}.form{display:grid;gap:14px;margin-top:22px}.form label{font-size:13px;font-weight:bold}.form input{width:100%;padding:12px;border:1px solid #d9dde5;border-radius:3px;margin-top:5px}.form button{border:0;background:#0875e1;color:#fff;padding:13px;border-radius:3px;font-weight:bold}.back{display:inline-block;margin-top:18px;color:#0875e1;text-decoration:none;font-weight:bold}.message{color:#0875e1}
</style>
</head>
<body>
<main class="panel"><h1>PHYNEX Account</h1><p>This sign-in form is ready for backend integration. No account or password is sent anywhere from this demo.</p><form class="form" id="accountForm"><label>Email<input required type="email" autocomplete="email"></label><label>Password<input required type="password" autocomplete="current-password"></label><button type="submit">Continue</button></form><p class="message" id="accountMessage"></p><a class="back" href="index.html">Back to store</a></main>
<script>
document.getElementById("accountForm").addEventListener("submit", function (event) { event.preventDefault(); document.getElementById("accountMessage").textContent = "Sign-in is ready for connection to your account service."; });
</script>
</body>
</html>
