<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — PHYNEX</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6f8;
            color: #222;
            line-height: 1.6;
        }

        .header {
            height: 64px;
            background: #073bce;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            color: white;
        }

        .logo { font-size: 25px; font-weight: 800; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 14px;
        }

        .header-right button {
            color: white;
            background: none;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .header-right button:hover { text-decoration: underline; }

        /* ---- Login screen ---- */

        .login-wrap {
            max-width: 380px;
            margin: 90px auto;
            background: white;
            border: 1px solid #e2e4e8;
            padding: 30px;
        }

        .login-wrap h2 { font-size: 20px; margin-bottom: 6px; }
        .login-wrap p.sub { color: #666; font-size: 13px; margin-bottom: 20px; }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 5px;
            margin-top: 14px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d9dde5;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #073bce;
        }

        button.primary {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #073bce;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        button.primary:hover { background: #052fa5; }
        button.primary:disabled { opacity: .6; cursor: default; }

        .msg {
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 5px;
            font-size: 13px;
            display: none;
        }

        .msg.error { display: block; background: #fdeaea; color: #b42318; }
        .msg.success { display: block; background: #e8f6ec; color: #0f7a3d; }

        /* ---- Dashboard ---- */

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 30px auto 60px;
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tabs button {
            padding: 8px 16px;
            border: 1px solid #d9dde5;
            background: white;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            color: #444;
        }

        .tabs button.active {
            background: #073bce;
            border-color: #073bce;
            color: white;
        }

        .empty-note {
            color: #777;
            font-size: 14px;
            padding: 30px 0;
            text-align: center;
        }

        .product-card {
            background: white;
            border: 1px solid #e2e4e8;
            padding: 18px;
            margin-bottom: 14px;
            display: flex;
            gap: 16px;
        }

        .product-card img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            background: #f5f6f8;
            border: 1px solid #eee;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .product-card .info { flex: 1; min-width: 0; }

        .product-card .name {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .product-card .meta {
            font-size: 12px;
            color: #666;
            margin-bottom: 3px;
        }

        .product-card .price {
            font-size: 14px;
            font-weight: 700;
            color: #071a49;
            margin: 6px 0;
        }

        .product-card .description {
            font-size: 13px;
            color: #444;
            margin-bottom: 6px;
        }

        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .badge.pending { background: #fff4e0; color: #a15c00; }
        .badge.approved { background: #e8f6ec; color: #0f7a3d; }
        .badge.rejected { background: #fdeaea; color: #b42318; }
        .badge.sponsored { background: #eaf1ff; color: #073bce; margin-left: 6px; }

        .reject-reason {
            font-size: 12px;
            color: #b42318;
            margin-bottom: 6px;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .actions button {
            padding: 7px 14px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-approve { background: #0f7a3d; color: white; }
        .btn-approve:hover { background: #0c6230; }

        .btn-reject { background: #b42318; color: white; }
        .btn-reject:hover { background: #8f1c13; }

        .btn-sponsor { background: #eaf1ff; color: #073bce; border: 1px solid #073bce !important; }
        .btn-sponsor:hover { background: #d9e6ff; }

        .btn-delete { background: none; color: #999; border: 1px solid #d9dde5 !important; }
        .btn-delete:hover { color: #b42318; border-color: #b42318 !important; }

        .thumbs {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .thumbs img, .thumbs video {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #eee;
        }

        @media (max-width: 600px) {
            .product-card { flex-direction: column; }
            .product-card img { width: 100%; height: 160px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">PHYNEX <span style="font-weight:400;font-size:14px;">Admin</span></div>
        <div class="header-right" id="headerRight" style="display:none;">
            <button id="logoutBtn">Log Out</button>
        </div>
    </header>

    <!-- LOGIN SCREEN -->
    <div class="login-wrap" id="loginScreen">
        <h2>Admin Login</h2>
        <p class="sub">Enter the admin password to review product listings.</p>

        <form id="loginForm">
            <label for="adminPassword">Password</label>
            <input type="password" id="adminPassword" required>

            <div id="loginMsg" class="msg"></div>

            <button type="submit" class="primary" id="loginBtn">Log In</button>
        </form>
    </div>

    <!-- DASHBOARD -->
    <main class="container" id="dashboard" style="display:none;">

        <div class="tabs" id="tabs">
            <button data-status="pending" class="active">Pending</button>
            <button data-status="approved">Approved</button>
            <button data-status="rejected">Rejected</button>
            <button data-status="">All</button>
        </div>

        <div id="productList"></div>

    </main>

    <script>
        var ADMIN_TOKEN_KEY = 'phynexAdminToken';
        var token = localStorage.getItem(ADMIN_TOKEN_KEY);
        var currentStatus = 'pending';

        var loginScreen = document.getElementById('loginScreen');
        var dashboard = document.getElementById('dashboard');
        var headerRight = document.getElementById('headerRight');

        function showDashboard() {
            loginScreen.style.display = 'none';
            dashboard.style.display = 'block';
            headerRight.style.display = 'flex';
            loadProducts();
        }

        function showLogin() {
            loginScreen.style.display = 'block';
            dashboard.style.display = 'none';
            headerRight.style.display = 'none';
        }

        if (token) {
            showDashboard();
        } else {
            showLogin();
        }

        document.getElementById('logoutBtn').addEventListener('click', function () {
            localStorage.removeItem(ADMIN_TOKEN_KEY);
            token = null;
            showLogin();
        });

        /* ---- Login ---- */

        document.getElementById('loginForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            var msg = document.getElementById('loginMsg');
            var btn = document.getElementById('loginBtn');
            var password = document.getElementById('adminPassword').value;

            msg.className = 'msg';
            btn.disabled = true;
            btn.textContent = 'Logging in...';

            try {
                var response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: password })
                });

                var data = await response.json();

                if (!response.ok) {
                    msg.className = 'msg error';
                    msg.textContent = data.message || 'Login failed.';
                    btn.disabled = false;
                    btn.textContent = 'Log In';
                    return;
                }

                token = data.token;
                localStorage.setItem(ADMIN_TOKEN_KEY, token);
                btn.disabled = false;
                btn.textContent = 'Log In';
                showDashboard();

            } catch (error) {
                msg.className = 'msg error';
                msg.textContent = 'Network error. Please try again.';
                btn.disabled = false;
                btn.textContent = 'Log In';
            }
        });

        /* ---- Tabs ---- */

        document.getElementById('tabs').addEventListener('click', function (event) {
            var button = event.target.closest('button[data-status]');
            if (!button) return;

            document.querySelectorAll('#tabs button').forEach(function (b) {
                b.classList.remove('active');
            });
            button.classList.add('active');

            currentStatus = button.dataset.status;
            loadProducts();
        });

        /* ---- Helpers ---- */

        function money(value) {
            return 'KSh ' + Number(value || 0).toLocaleString('en-KE');
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        async function adminFetch(url, options) {
            options = options || {};
            options.headers = Object.assign({}, options.headers, {
                Authorization: 'Bearer ' + token
            });

            var response = await fetch(url, options);

            if (response.status === 401) {
                localStorage.removeItem(ADMIN_TOKEN_KEY);
                token = null;
                showLogin();
                throw new Error('Session expired');
            }

            return response;
        }

        /* ---- Load & render products ---- */

        async function loadProducts() {

            var list = document.getElementById('productList');
            list.innerHTML = '<p class="empty-note">Loading...</p>';

            try {
                var url = '/api/admin/products' + (currentStatus ? '?status=' + currentStatus : '');
                var response = await adminFetch(url);
                var data = await response.json();
                var products = data.products || [];

                if (products.length === 0) {
                    list.innerHTML = '<p class="empty-note">No products here.</p>';
                    return;
                }

                list.innerHTML = products.map(renderProductCard).join('');

            } catch (error) {
                if (error.message !== 'Session expired') {
                    list.innerHTML = '<p class="empty-note">Could not load products.</p>';
                }
            }
        }

        function renderProductCard(product) {

            var reasonHtml = '';
            if (product.status === 'rejected' && product.rejectionReason) {
                reasonHtml = '<div class="reject-reason">Reason: ' + escapeHtml(product.rejectionReason) + '</div>';
            }

            var sponsoredBadge = product.sponsored
                ? '<span class="badge sponsored">Sponsored</span>'
                : '';

            var thumbsHtml = (product.media || []).map(function (m) {
                if (m.type === 'video') {
                    return '<video src="' + escapeHtml(m.url) + '" muted></video>';
                }
                return '<img src="' + escapeHtml(m.url) + '">';
            }).join('');

            var approveBtn = product.status !== 'approved'
                ? '<button class="btn-approve" onclick="approveProduct(' + product.id + ')">Approve</button>'
                : '';

            var rejectBtn = product.status !== 'rejected'
                ? '<button class="btn-reject" onclick="rejectProduct(' + product.id + ')">Reject</button>'
                : '';

            var sponsorBtn = '<button class="btn-sponsor" onclick="toggleSponsor(' + product.id + ', ' + (!product.sponsored) + ')">' +
                (product.sponsored ? 'Unsponsor' : 'Sponsor') + '</button>';

            return '' +
                '<div class="product-card" data-id="' + product.id + '">' +
                    '<img src="' + escapeHtml(product.image) + '" onerror="this.style.visibility=\'hidden\'">' +
                    '<div class="info">' +
                        '<span class="badge ' + product.status + '">' + product.status + '</span>' +
                        sponsoredBadge +
                        '<div class="name">' + escapeHtml(product.name) + '</div>' +
                        '<div class="meta">Seller: ' + escapeHtml(product.sellerName || '') + ' (' + escapeHtml(product.sellerEmail || '') + ')</div>' +
                        '<div class="meta">Category: ' + escapeHtml(product.category || '—') + '</div>' +
                        '<div class="price">' + money(product.price) +
                            (product.oldPrice ? ' <span style="color:#999;font-weight:400;text-decoration:line-through;">' + money(product.oldPrice) + '</span>' : '') +
                        '</div>' +
                        (product.description ? '<div class="description">' + escapeHtml(product.description) + '</div>' : '') +
                        (product.specifications ? '<div class="description"><strong>Specs:</strong> ' + escapeHtml(product.specifications) + '</div>' : '') +
                        reasonHtml +
                        (thumbsHtml ? '<div class="thumbs">' + thumbsHtml + '</div>' : '') +
                        '<div class="actions">' +
                            approveBtn +
                            rejectBtn +
                            sponsorBtn +
                            '<button class="btn-delete" onclick="deleteProduct(' + product.id + ')">Delete</button>' +
                        '</div>' +
                    '</div>' +
                '</div>';
        }

        /* ---- Actions ---- */

        window.approveProduct = async function (id) {
            try {
                await adminFetch('/api/admin/products/' + id + '/approve', { method: 'POST' });
                loadProducts();
            } catch (error) { /* handled in adminFetch */ }
        };

        window.rejectProduct = async function (id) {
            var reason = prompt('Reason for rejecting this product (shown to the seller):');
            if (reason === null) return;

            try {
                await adminFetch('/api/admin/products/' + id + '/reject', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reason: reason })
                });
                loadProducts();
            } catch (error) { /* handled in adminFetch */ }
        };

        window.toggleSponsor = async function (id, sponsored) {
            try {
                await adminFetch('/api/admin/products/' + id + '/sponsor', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sponsored: sponsored })
                });
                loadProducts();
            } catch (error) { /* handled in adminFetch */ }
        };

        window.deleteProduct = async function (id) {
            if (!confirm('Permanently delete this product?')) return;

            try {
                await adminFetch('/api/admin/products/' + id, { method: 'DELETE' });
                loadProducts();
            } catch (error) { /* handled in adminFetch */ }
        };
    </script>

</body>
</html>
