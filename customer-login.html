<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — PHYNEX</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6f8;
            color: #172033;
            line-height: 1.6;
        }

        .top {
            background: #071a49;
            color: #fff;
            padding: 16px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top a { color: #fff; text-decoration: none; font-size: 14px; }
        .top a:hover { text-decoration: underline; }

        .wrap {
            width: 90%;
            max-width: 420px;
            margin: 50px auto 70px;
        }

        .card {
            background: white;
            border: 1px solid #e1e4e8;
            border-radius: 12px;
            padding: 32px 30px;
        }

        .card h1 { font-size: 24px; margin-bottom: 6px; }

        .card p.sub {
            color: #666;
            font-size: 14px;
            margin-bottom: 22px;
        }

        .redirect-note {
            background: #eef4ff;
            color: #0875e1;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            margin-bottom: 18px;
            display: none;
        }

        #googleBtn {
            margin-top: 4px;
            display: flex;
            justify-content: center;
            min-height: 40px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
            color: #8a90a0;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e1e4e8;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
            margin-top: 16px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .label-row a {
            font-size: 12px;
            font-weight: 700;
            color: #0875e1;
            text-decoration: none;
        }

        .label-row a:hover { text-decoration: underline; }

        input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #d9dde5;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus { outline: none; border-color: #0875e1; }

        button.submit {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            background: #0875e1;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button.submit:hover { background: #075fc0; }
        button.submit:disabled { opacity: .6; cursor: default; }

        .switch {
            margin-top: 18px;
            font-size: 13px;
            text-align: center;
            color: #555;
        }

        .switch a { color: #0875e1; font-weight: 700; }

        .msg {
            margin-top: 16px;
            padding: 10px 12px;
            border-radius: 5px;
            font-size: 13px;
            display: none;
        }

        .msg.error { display: block; background: #fdeaea; color: #b42318; }
        .msg.success { display: block; background: #e8f6ec; color: #0f7a3d; }
    </style>
</head>
<body>

    <header class="top">
        <strong>PHYNEX</strong>
        <a href="index.html">← Continue Shopping</a>
    </header>

    <main class="wrap">
        <div class="card">
            <h1>Log In</h1>
            <p class="sub">Log in to your PHYNEX account to place your order.</p>

            <div class="redirect-note" id="redirectNote">
                Log in to finish checking out.
            </div>

            <div id="googleBtn"></div>
            <div class="divider" id="googleDivider" style="display:none;">or log in with email</div>

            <form id="loginForm">

                <label for="identifier">Email or Kenyan phone</label>
                <input type="text" id="identifier" autocomplete="username" required>

                <div class="label-row">
                    <label for="password" style="margin-top:0;">Password</label>
                    <a href="customer-forgot-password.html">Forgot password?</a>
                </div>
                <input type="password" id="password" autocomplete="current-password" required>

                <div id="formMsg" class="msg"></div>

                <button type="submit" class="submit" id="submitBtn">Log In</button>
            </form>

            <p class="switch">New to PHYNEX? <a href="#" id="registerLink">Create an account</a></p>
            <p class="switch"><a href="#" id="resendVerification">Resend verification email</a></p>
        </div>
    </main>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('redirect') || '';
        var verified = params.get('verified');

        if (redirect) document.getElementById('redirectNote').style.display = 'block';

        document.getElementById('registerLink').href =
            'customer-register.html' + (redirect ? '?redirect=' + encodeURIComponent(redirect) : '');

        function showMessage(text, success) {
            var msg = document.getElementById('formMsg');
            msg.className = success ? 'msg success' : 'msg error';
            msg.textContent = text;
        }

        if (verified === '1') showMessage('Your account has been verified. You can now log in.', true);
        if (verified === '0') showMessage('This verification link is invalid or has expired.', false);

        (function initGoogle() {
            fetch('/api/config').then(function (r) { return r.json(); }).then(function (config) {
                if (!config.googleClientId || typeof google === 'undefined') return;

                google.accounts.id.initialize({
                    client_id: config.googleClientId,
                    callback: async function (response) {
                        try {
                            var res = await fetch('/api/customers/google', {
                                method: 'POST',
                                credentials: 'include',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ credential: response.credential })
                            });
                            var data = await res.json();
                            if (!res.ok) {
                                showMessage(data.message || 'Google sign-in failed.', false);
                                return;
                            }
                            window.location.href = redirect || 'account.html';
                        } catch (error) {
                            showMessage('Network error. Please try again.', false);
                        }
                    }
                });

                google.accounts.id.renderButton(
                    document.getElementById('googleBtn'),
                    { theme: 'outline', size: 'large', width: 340 }
                );
                document.getElementById('googleDivider').style.display = 'flex';
            }).catch(function () {});
        })();

        document.getElementById('resendVerification').addEventListener('click', async function (event) {
            event.preventDefault();
            var email = document.getElementById('identifier').value.trim();
            if (!email || email.indexOf('@') === -1) {
                showMessage('Enter your email address first.', false);
                return;
            }

            try {
                var response = await fetch('/api/customers/resend-verification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                var data = await response.json();
                showMessage(data.message || 'If that account needs verification, a new verification email has been sent.', response.ok);
            } catch (error) {
                showMessage('Network error. Please try again.', false);
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            var msg = document.getElementById('formMsg');
            var btn = document.getElementById('submitBtn');

            msg.className = 'msg';
            msg.textContent = '';
            btn.disabled = true;
            btn.textContent = 'Logging in...';

            try {
                var response = await fetch('/api/customers/login', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        identifier: document.getElementById('identifier').value.trim(),
                        password: document.getElementById('password').value
                    })
                });

                var data = await response.json();

                if (!response.ok) {
                    if (data.phoneVerificationRequired) {
                        window.location.href = 'customer-verify-phone.html' +
                            '?redirect=' + encodeURIComponent(redirect);
                        return;
                    }

                    showMessage(data.message || 'Could not log you in.', false);
                    btn.disabled = false;
                    btn.textContent = 'Log In';
                    return;
                }

                localStorage.setItem('phynexCustomerName', data.customer.name);
                window.location.href = redirect || 'account.html';

            } catch (error) {
                showMessage('Network error. Please try again.', false);
                btn.disabled = false;
                btn.textContent = 'Log In';
            }
        });
    </script>
</body>
</html>
