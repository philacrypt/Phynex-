<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHYNEX - Category</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#172033}
.header{background:#fff;position:sticky;top:0;z-index:20;border-bottom:1px solid #e7eaf0;padding:14px 5%}
.top{display:flex;align-items:center;justify-content:space-between;gap:15px;max-width:1200px;margin:auto}
.brand{font-size:25px;font-weight:800;color:#0875e1;text-decoration:none}
.actions{display:flex;gap:10px} .btn{border:0;background:#0875e1;color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:700;cursor:pointer}
.container{max-width:1200px;margin:auto;padding:25px 5% 90px}
.back{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:#0875e1;font-weight:700;margin-bottom:15px}
h1{margin:5px 0 20px;font-size:28px} .sub{color:#687083;margin-top:-10px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e4e7ed;cursor:pointer;text-decoration:none;color:inherit;transition:.2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(7,26,73,.12)}
.pic{height:220px;background:#fff;padding:12px;display:flex;align-items:center;justify-content:center} .pic img{width:100%;height:100%;object-fit:contain}
.info{padding:13px} .name{font-size:14px;font-weight:700;line-height:1.4;min-height:40px} .rating{color:#f4a300;font-size:12px;margin:7px 0} .price{font-size:18px;font-weight:800;color:#0875e1}
.empty{background:#fff;border-radius:12px;padding:35px;text-align:center;color:#687083}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.container{padding:18px 12px 90px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.pic{height:155px}.info{padding:9px}.name{font-size:12px}.price{font-size:15px}h1{font-size:22px}.brand{font-size:21px}}
</style>
</head>
<body>
<header class="header"><div class="top"><a class="brand" href="index.html">PHYNEX</a><div class="actions"><a class="btn" href="cart.html"><i class="fa-solid fa-cart-shopping"></i> Cart</a><a class="btn" href="index.html">Home</a></div></div></header>
<main class="container"><a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to PHYNEX</a><h1 id="title">Category</h1><p class="sub" id="count"></p><div class="grid" id="grid"></div></main>
<script>
function escapeHtml(text){const d=document.createElement('div');d.textContent=text||'';return d.innerHTML;}
function slugify(text){return String(text||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');}
function money(value){return 'KSh '+Number(value||0).toLocaleString('en-KE');}

const params = new URLSearchParams(location.search);
const categoryParam = (params.get('category') || 'all');
const targetSlug = categoryParam.toLowerCase() === 'all' ? 'all' : slugify(categoryParam);

async function init(){
    const titleEl = document.getElementById('title');
    const countEl = document.getElementById('count');
    const grid = document.getElementById('grid');

    try {
        const [catRes, prodRes] = await Promise.all([
            fetch('/api/categories'),
            fetch('/api/products')
        ]);
        const catData = await catRes.json();
        const prodData = await prodRes.json();

        const categories = Array.isArray(catData.categories) ? catData.categories : [];
        const products = Array.isArray(prodData.products) ? prodData.products : [];

        let label = 'All Products';
        let filtered = products;

        if (targetSlug !== 'all') {
            const match = categories.find(function(c){ return slugify(c.slug || c.name) === targetSlug; });
            label = match ? match.name : categoryParam.replace(/-/g, ' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); });

            filtered = products.filter(function(p){
                const productSlug = slugify(p.category || '');
                return productSlug === targetSlug || productSlug.indexOf(targetSlug) !== -1 || targetSlug.indexOf(productSlug) !== -1;
            });
        }

        document.title = 'PHYNEX - ' + label;
        titleEl.textContent = label;
        countEl.textContent = filtered.length + ' product' + (filtered.length === 1 ? '' : 's') + ' available';

        if (!filtered.length) {
            grid.innerHTML = '<div class="empty">No products are currently listed in this category.</div>';
            return;
        }

        grid.innerHTML = '';
        filtered.forEach(function(p){
            const a = document.createElement('a');
            a.className = 'card';
            a.href = 'index.html?product=' + encodeURIComponent(p.id);
            a.innerHTML =
                '<div class="pic"><img src="' + escapeHtml(p.image || '') + '" alt="' + escapeHtml(p.name) + '" loading="lazy"></div>' +
                '<div class="info">' +
                    '<div class="name">' + escapeHtml(p.name) + '</div>' +
                    '<div class="rating">' + (p.sellerName ? 'Sold by ' + escapeHtml(p.sellerName) : '') + '</div>' +
                    '<div class="price">' + money(p.price) + '</div>' +
                '</div>';
            grid.appendChild(a);
        });

    } catch (error) {
        countEl.textContent = '';
        grid.innerHTML = '<div class="empty">Could not load products right now. Please try again shortly.</div>';
    }
}

init();
</script>
</body></html>
