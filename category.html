<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHYNEX - Category</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#172033}
.header{background:#fff;position:sticky;top:0;z-index:20;border-bottom:1px solid #e7eaf0;padding:14px 5%}
.top{display:flex;align-items:center;justify-content:space-between;gap:15px;max-width:1200px;margin:auto}
.brand{font-size:25px;font-weight:800;color:#0875e1;text-decoration:none}
.actions{display:flex;gap:10px} .btn{border:0;background:#0875e1;color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:700;cursor:pointer}
.container{max-width:1200px;margin:auto;padding:25px 5% 90px}
.back{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:#0875e1;font-weight:700;margin-bottom:15px}
h1{margin:5px 0 20px;font-size:28px} .sub{color:#687083;margin-top:-10px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e4e7ed;cursor:pointer;text-decoration:none;color:inherit;transition:.2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(7,26,73,.12)}
.pic{height:220px;background:#fff;padding:12px;display:flex;align-items:center;justify-content:center} .pic img{width:100%;height:100%;object-fit:contain}
.info{padding:13px} .name{font-size:14px;font-weight:700;line-height:1.4;min-height:40px} .rating{color:#f4a300;font-size:12px;margin:7px 0} .price{font-size:18px;font-weight:800;color:#0875e1}
.empty{background:#fff;border-radius:12px;padding:35px;text-align:center;color:#687083}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.container{padding:18px 12px 90px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.pic{height:155px}.info{padding:9px}.name{font-size:12px}.price{font-size:15px}h1{font-size:22px}.brand{font-size:21px}}
</style>
</head>
<body>
<header class="header"><div class="top"><a class="brand" href="index.html">PHYNEX</a><div class="actions"><a class="btn" href="cart.html"><i class="fa-solid fa-cart-shopping"></i> Cart</a><a class="btn" href="index.html">Home</a></div></div></header>
<main class="container"><a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to PHYNEX</a><h1 id="title">Category</h1><p class="sub" id="count"></p><div class="grid" id="grid"></div></main>
<script>
const products=[{"name": "Dell Vostro 15 3500 i7 11th Gen 8GB 400GB SSD", "image": "images/13.jpeg", "alt": "Laptop", "price": "KSh 35,000 KSh 40,000", "rating": "", "description": "A dependable Dell laptop for work, study and everyday productivity.", "specifications": "Intel Core i7 11th Gen | 8GB RAM | 400GB SSD", "categories": ["computers", "laptops", "home-office", "deals", "new"]}, {"name": "HP EliteDesk 830 G5 i5 8th Gen 8GB 256GB SSD", "image": "images/18.jpeg", "alt": "Laptop", "price": "KSh 32,500 KSh 36,000", "rating": "", "description": "A professionally refurbished HP desktop with responsive performance for office and home use.", "specifications": "Intel Core i5 8th Gen | 8GB RAM | 256GB SSD", "categories": ["computers", "desktops", "home-office", "deals", "new"]}, {"name": "BT Speaker HF226", "image": "images/19.jpeg", "alt": "BT speaker", "price": "KSh 2,000 KSh 2,500", "rating": "", "description": "A portable Bluetooth speaker with clear sound for music, calls and everyday entertainment.", "specifications": "Bluetooth wireless audio | Portable design | Rechargeable battery", "categories": ["electronics", "audio", "accessories", "deals", "new"]}, {"name": "MacBook Air i5 2017 256GB SSD 8GB RAM", "image": "images/17.jpeg", "alt": "MacBook", "price": "KSh 20,500 KSh 35,000", "rating": "", "description": "A compact MacBook with a sharp display and reliable performance for everyday computing.", "specifications": "Intel Core i5 | 8GB RAM | 256GB SSD", "categories": ["computers", "laptops", "deals", "new"]}, {"name": "Lenovo Thinkpad T460 256GB SSD 8GB RAM", "image": "images/20.jpeg", "alt": "Laptop", "price": "KSh 23,000 KSh 25,000", "rating": "", "description": "A durable Lenovo ThinkPad with a comfortable keyboard and fast SSD storage for work on the go.", "specifications": "Intel Core i5 | 8GB RAM | 256GB SSD", "categories": ["computers", "laptops", "deals", "new"]}];
const labels={all:'All Products',phones:'Phones & Tablets',computers:'Computers',laptops:'Laptops',electronics:'Electronics',gaming:'Gaming',accessories:'Accessories', 'home-office':'Home & Office',deals:'Deals',new:'New Arrivals',smartwatch:'Smart Watch',audio:'Audio'};
const params=new URLSearchParams(location.search); const category=(params.get('category')||'all').toLowerCase();
const label=labels[category]||category.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
document.title='PHYNEX - '+label; document.getElementById('title').textContent=label;
const filtered=category==='all'?products:products.filter(p=>p.categories.includes(category));
document.getElementById('count').textContent=filtered.length+' product'+(filtered.length===1?'':'s')+' available';
const grid=document.getElementById('grid');
if(!filtered.length){grid.innerHTML='<div class="empty">No products are currently listed in this category.</div>';}
else filtered.forEach(p=>{
 const a=document.createElement('a'); a.className='card';
 a.href='index.html?product='+encodeURIComponent(p.name);
 a.innerHTML='<div class="pic"><img src="'+p.image+'" alt="'+(p.alt||p.name).replace(/"/g,'&quot;')+'" loading="lazy" onerror="this.src=\'images/no-image.svg\'"></div><div class="info"><div class="name">'+p.name+'</div><div class="rating">'+(p.rating||'No ratings yet')+'</div><div class="price">'+(p.price.split(' ')[0]||'')+' '+p.price.split(' ').slice(1).join(' ')+'</div></div>';
 grid.appendChild(a);
});
</script>
</body></html>
