<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — PHYNEX</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b1730;
            color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            padding: 34px 32px;
            width: 90%;
            max-width: 380px;
            border-radius: 6px;
        }

        .card h1 { font-size: 22px; margin-bottom: 6px; }
        .card p.sub { color: #666; font-size: 13px; margin-bottom: 20px; }

        label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }

        input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #d9dde5;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus { outline: none; border-color: #073bce; }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            background: #073bce;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover { background: #052fa5; }
        button:disabled { opacity: .6; }

        .msg {
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 5px;
            font-size: 13px;
            display: none;
        }

        .msg.error { display: block; background: #fdeaea; color: #b42318; }
    </style>
</head>
<body>

    <div class="card">
        <h1>PHYNEX Admin</h1>
        <p class="sub">Enter the admin password to review seller submissions.</p>

        <form id="loginForm">
            <label for="password">Password</label>
            <input type="password" id="password" required autofocus>
            <div id="formMsg" class="msg"></div>
            <button type="submit" id="submitBtn">Log In</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            var msg = document.getElementById('formMsg');
            var btn = document.getElementById('submitBtn');

            msg.className = 'msg';
            btn.disabled = true;
            btn.textContent = 'Logging in...';

            try {
                var response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: document.getElementById('password').value })
                });

                var data = await response.json();

                if (!response.ok) {
                    msg.className = 'msg error';
                    msg.textContent = data.message || 'Login failed.';
                    btn.disabled = false;
                    btn.textContent = 'Log In';
                    return;
                }

                sessionStorage.setItem('phynexAdminToken', data.token);
                window.location.href = 'admin-dashboard.html';

            } catch (error) {
                msg.className = 'msg error';
                msg.textContent = 'Network error. Please try again.';
                btn.disabled = false;
                btn.textContent = 'Log In';
            }
        });
    </script>

</body>
</html>
